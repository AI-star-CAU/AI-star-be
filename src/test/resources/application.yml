spring:
  datasource:
    url: jdbc:h2:mem:ai_star_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  secret: test-jwt-secret-key-for-ai-star-server-32bytes
  expiration: 3600000
