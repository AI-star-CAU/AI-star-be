spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: "AIT"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스 이름
    url: ${DB_URL} # jdbc:mysql://localhost:3306/{데이터베이스명}
    username: ${DB_USER} # MySQL 유저 이름
    password: ${DB_PW} # MySQL 비밀번호

  jpa:
    show-sql: true # 실행된 SQL 쿼리를 콘솔에 출력할지 여부 설정
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 데이터베이스 스키마의 상태를 설정
    properties:
      hibernate:
        format_sql: true # 출력되는 SQL 쿼리를 보기 좋게 포맷팅

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyMustBeAtLeast256Bits!!}
  expiration: 43200000  # 12시간 (ms)

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:https://ait.hanbin5.com}
    connect-timeout: 3000
    read-timeout: 60000
    context-window: 128000
    api-key: ${AISTAR_AI_API_KEY:}
    cf-access-client-id: ${CF_ACCESS_CLIENT_ID:}
    cf-access-client-secret: ${CF_ACCESS_CLIENT_SECRET:}

server:
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs
