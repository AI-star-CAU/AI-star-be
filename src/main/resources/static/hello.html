<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aistar Backend :: Hello World</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Poppins', sans-serif;
            display: flex; justify-content: center; align-items: center;
            color: white; background: #0f172a;
        }

        .space-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                    radial-gradient(circle at 30% 20%, rgba(255, 0, 255, 0.1), transparent 40%),
                    radial-gradient(circle at 70% 80%, rgba(0, 255, 255, 0.1), transparent 40%);
            z-index: 0;
        }

        .stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                    radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.5; z-index: 1;
        }

        .content { text-align: center; position: relative; z-index: 2; }

        h1 {
            font-size: 4rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(165, 180, 252, 0.5);
        }

        p { font-size: 1.1rem; opacity: 0.7; margin-bottom: 3rem; }

        /* 팀원 섹션 스타일 */
        .team-container {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px; border-radius: 12px;
            backdrop-filter: blur(5px); transition: 0.3s;
        }

        .member-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #a5b4fc;
        }

        .member-role {
            display: block; font-size: 0.7rem; color: #a5b4fc;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
        }

        .member-name { font-weight: 600; font-size: 1rem; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="space-bg"></div>
<div class="stars"></div>
<div class="content">
    <h1>Hello World!</h1>
    <p>🌟 Welcome to aistar Project - Meet our crew 🌟</p>

    <div class="team-container">
        <div class="member-card"><span class="member-role">Team Leader</span><span class="member-name">오한빈</span></div>
        <div class="member-card"><span class="member-role">Developer</span><span class="member-name">김도윤</span></div>
        <div class="member-card"><span class="member-role">Developer</span><span class="member-name">김상민</span></div>
        <div class="member-card"><span class="member-role">Developer</span><span class="member-name">이준석</span></div>
        <div class="member-card"><span class="member-role">Developer</span><span class="member-name">정주원</span></div>
    </div>
</div>
</body>
</html>
